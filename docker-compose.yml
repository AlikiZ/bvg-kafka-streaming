services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Two listeners:
      #   PLAINTEXT       → used inside the Docker network (container-to-container)
      #   PLAINTEXT_HOST  → used from your host machine (where your Python script runs)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1      # fine for single-broker local setup
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"        # creates bvg-departures automatically on first produce
      KAFKA_LOG_RETENTION_HOURS: 24                  # keep messages for 24 hours

  # Optional but very useful: web UI to inspect topics, messages and consumer groups
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Persist the data in postgresql in a volume managed by Docker
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: bvg
      POSTGRES_PASSWORD: bvg
      POSTGRES_DB: bvg_delays
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persists data across restarts
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # runs on first startup only

volumes:
  postgres_data: